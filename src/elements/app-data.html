<link rel="import" href="../../bower_components/polymer/polymer.html">
<link rel="import" href="../../bower_components/iron-ajax/iron-ajax.html">

<dom-module id="app-data">
  <template>
    <!-- Blog posts -->
    <iron-ajax auto url="[[postsSource]]" handle-as="json" on-response="_reversePosts"></iron-ajax>

    <!-- Données statiques JSON (mode OVH - sans Firebase) -->
    <iron-ajax
      auto
      url="/data/speakers.json"
      handle-as="json"
      last-response="{{_speakersRaw}}">
    </iron-ajax>

    <iron-ajax
      auto
      url="/data/sessions.json"
      handle-as="json"
      last-response="{{_sessionsRaw}}">
    </iron-ajax>

    <iron-ajax
      auto
      url="/data/schedule.json"
      handle-as="json"
      last-response="{{_scheduleRaw}}">
    </iron-ajax>

    <iron-ajax
      auto
      url="/data/partners.json"
      handle-as="json"
      last-response="{{app.partners}}">
    </iron-ajax>

    <iron-ajax
      auto
      url="/data/videos.json"
      handle-as="json"
      last-response="{{app.videos}}">
    </iron-ajax>

    <iron-ajax
      auto
      url="/data/team.json"
      handle-as="json"
      last-response="{{app.team}}">
    </iron-ajax>

    <iron-ajax
      auto
      url="/data/tickets.json"
      handle-as="json"
      last-response="{{app.tickets}}">
    </iron-ajax>

  </template>
  <script>
    (function () {
      'use strict';

      Polymer({
        is: 'app-data',

        properties: {
          app: {
            type: Object,
            notify: true
          },

          postsSource: {
            type: String,
            value: 'data/blog.json'
          },

          posts: {
            type: Array,
            notify: true
          },

          speakers: {
            type: Array,
            notify: true
          },

          sessions: {
            type: Array,
            notify: true
          },

          schedule: {
            type: Array,
            notify: true
          },

          _speakersRaw: {
            type: Object
          },

          _sessionsRaw: {
            type: Object
          },

          _scheduleRaw: {
            type: Array
          }
        },

        observers: [
          '_generateSchedule(_speakersRaw, _sessionsRaw, _scheduleRaw)'
        ],

        ready: function () {
          this.app = this.app || {};
        },

      _generateSchedule: function () {
        var myWorker = new Worker('./scripts/helper/schedule-webworker.js');

        myWorker.postMessage({
          speakers: this._speakersRaw,
          sessions: this._sessionsRaw,
          schedule: this._scheduleRaw
        });

        myWorker.addEventListener('message', function(e) {
          this.set('schedule', e.data.schedule);
          this.set('sessions', e.data.sessions);
          this.set('speakers', e.data.speakers);
          myWorker.terminate();
        }.bind(this), false);

      },

      _reversePosts: function (response) {
        this.posts = response.detail.response.reverse();
      }
    });

  }());
  </script>
</dom-module>
